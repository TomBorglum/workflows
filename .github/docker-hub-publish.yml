# What this repository publishes, read by .github/workflows/docker-hub-publish.yml.
#
# This repository is its own caller: _test-docker-hub-publish.yml calls the workflow by local
# path, so this file is both the fixture the test runs against and the worked example a consumer
# copies. README.md documents every key.
#
# `gates:` is absent, so the test covers the `always` default. The `release` branch cannot be
# covered here - _test-docker-hub-publish.yml records why.
images:
  directories:
    # Declares both suppression keys. Each path resolves against this directory:
    # fixture-image/.trivyignore.yaml and fixture-image/fixture.openvex.json.
    fixture-image:
      trivyignores:
        - .trivyignore.yaml
      vex-documents:
        - fixture.openvex.json
    # Declares nothing, which is the assertion: this leg must receive no paths at all rather
    # than the other image's.
    fixture-image-plain:

compose-projects:
  fixture-compose:
