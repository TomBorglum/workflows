name: docker-hub-publish test

# This repository's own CI, not a reusable workflow - hence the leading underscore.
#
# Exercises docker-hub-publish.yml by calling it the way a consumer would, by local path
# so the branch's version runs rather than a released tag. It builds fixture-image and
# validates fixture-compose, then asserts what a consumer would actually notice if it
# broke.
#
# EVERY FIXTURE IS A TOP-LEVEL DIRECTORY, which is forced twice over and is not a tidiness
# choice. The compose job refuses a nested directory outright, and the build job's artifact
# is named `image-<directory>`, which upload-artifact rejects if the name contains a slash.
# Moving any fixture under test/ breaks this test in two different places.
#
# The workflow declares NO workflow_call outputs, so there is nothing to assert the way
# _test-update-pixi-dependencies.yml asserts its own. What crosses the boundary instead are
# the two artifacts the `push` job would consume, and those are what `assert` reads back.
#
# `push` is the job with the credential, and it carries `if: github.event_name == 'release'`
# of its own. On a pull_request it skips, which is this workflow's equivalent of the
# `dry-run` input CONTRIBUTING asks for: nothing is published and no AWS call is made.
#
# `id-token: write` IS GRANTED BELOW, AND HAS TO BE, even though the job that uses it
# skips. A called workflow may not request more than the caller grants, and GitHub checks
# that when the run STARTS rather than when the job would run - so withholding it fails
# the whole run with `startup_failure` and no job logs, not with a skipped job. Measured:
# this test was written without it first. The grant is a ceiling, not a use.
#
# The `secrets:` block passes a syntactically valid but deliberately fake role ARN. It has
# to be passed at all because `aws-role-arn` is declared required, and a literal rather
# than a repository secret is what keeps this green on a fork pull request, where secrets
# are never available. Nothing ever assumes it: the only step that reads it is in `push`.
#
# THE CONFIG FILE IS .github/docker-hub-publish.yml, and the `config` input is left unset so
# the run also asserts that its default finds it. The file declares TWO images: fixture-image
# with both suppression keys, and fixture-image-plain with none. That pairing is the only
# arrangement that proves each matrix leg receives its OWN suppression paths rather than the
# union of every image's, which is the defect the config file replaced. `assert` reads both
# legs' staged `suppressions` back to check it.
#
# `images.gates` is left out of the config file, asserting the `always` default.
#
# The `release` branch of the vulnerability gate is NOT covered here, and cannot be. It
# needs an image carrying HIGH or CRITICAL findings, while fixture-image is FROM scratch
# precisely so this repository's required check cannot fail on a CVE published against a
# base. A second call job with a vulnerable fixture does not work either: the `compose`
# job uploads the fixed literal name `compose-files`, so two calls in one run collide on
# that artifact. The branch is verified in the consuming repository -
# docs/docker-hub-publish.md records it.
#
# Deliberately NOT path-filtered. When a filter excludes a pull request the checks stay
# Pending rather than passing, so a required check over a filtered workflow deadlocks the
# pull request permanently.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/docker-hub-publish.yml
    # A ceiling the called workflow can only lower, which `build` and `compose` both do.
    permissions:
      contents: read
      id-token: write
    with:
      # No `config`: the default, .github/docker-hub-publish.yml, is what declares both image
      # directories and the compose project, and the default is part of what this asserts.
      #
      # Well-formed but inert. Everything that validates them runs in `push`, which skips
      # here, so these only have to satisfy the declarations.
      aws-region: eu-north-1
      aws-ssm-parameter: /fixture/release/dockerhub-pat
      dockerhub-namespace: fixture-namespace
    secrets:
      aws-role-arn: arn:aws:iam::000000000000:role/fixture-never-assumed

  assert:
    needs: call
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-fixture-image
          path: /tmp/image

      # The second matrix leg, which exists to carry NO suppressions. Downloading it is also
      # the assertion that the config file produced two legs rather than one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-fixture-image-plain
          path: /tmp/image-plain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-files
          path: /tmp/compose

      - name: Assert each image archive, its digest and its repository
        run: |
          set -euo pipefail
          ls -la /tmp/image /tmp/image-plain

          # THE NAME FORMULA, which is the one thing a consumer cannot recover if it
          # changes: <namespace>/<repository>-<directory>. The namespace is the input
          # above, the repository is this one, and the directory is the matrix leg - which
          # now comes from the config file rather than from an input.
          for leg in 'image:fixture-image' 'image-plain:fixture-image-plain'; do
            path="/tmp/${leg%%:*}"
            directory="${leg#*:}"

            repository="$(cat "$path/repository")"
            echo "$directory repository=$repository"
            test "$repository" = "fixture-namespace/workflows-$directory"

            # A digest, and the shape of one: the push job resolves the archive against it,
            # so an empty or malformed value is a release that pushes nothing.
            digest="$(cat "$path/digest")"
            echo "$directory digest=$digest"
            grep -qE '^sha256:[0-9a-f]{64}$' <<<"$digest"

            # The archive is a real OCI layout, not an empty tar: the unpack the scan and
            # the push both depend on.
            tar -tf "$path/image.oci.tar" | grep -qx 'oci-layout'
            tar -tf "$path/image.oci.tar" | grep -qx 'index.json'
          done

      # WHAT THE WHOLE CHANGE EXISTS FOR. trivyignores and vex-documents were inputs, so one
      # list reached every image's scan and a finding accepted for one image was accepted for
      # all of them. They are per directory now, and these two legs differ, so the old union
      # behaviour would show up here as fixture-image-plain carrying fixture-image's paths.
      - name: Assert each image got its own suppressions and no other's
        run: |
          set -euo pipefail
          cat /tmp/image/suppressions /tmp/image-plain/suppressions

          # Prefixed with the image's own directory, which is what makes a suppression an
          # acceptance for ONE image: two images cannot name one file, so they diverge the
          # day one of them is fixed rather than masking the other's regression.
          test "$(jq -r '.trivyignores' /tmp/image/suppressions)" \
            = 'fixture-image/.trivyignore.yaml'
          test "$(jq -r '."vex-documents"' /tmp/image/suppressions)" \
            = 'fixture-image/fixture.openvex.json'

          # EMPTY, not inherited. Empty is also why the TRIVY_VEX step stays guarded: the
          # variable is a string list, so one empty path reads as a source trivy cannot open.
          test "$(jq -r '.trivyignores' /tmp/image-plain/suppressions)" = ''
          test "$(jq -r '."vex-documents"' /tmp/image-plain/suppressions)" = ''

      - name: Assert every compose directory was staged
        run: |
          set -euo pipefail
          find /tmp/compose -type f | sort

          # ALWAYS written, empty input included, which is what lets the push job keep a
          # plain `needs` gate on an empty compose list.
          grep -qx 'fixture-compose' /tmp/compose/directories

          test -f /tmp/compose/fixture-compose/compose.yaml

          # The fixture carries NO .env, which is the point of it: every name in its
          # compose file holds a `:?` or a `:-`, so the compose job staged and validated a
          # directory without one. A caller needing an .env to publish would be a
          # regression of the gate this asserts against.
          test ! -e /tmp/compose/fixture-compose/.env

          # Every interpolated name, placeholdered so `publish` can LOAD a file holding no
          # values - `${FIXTURE_MESSAGE:?...}` would abort the load otherwise. It leaves no
          # trace in the artifact: the compose file is published uninterpolated. This file
          # is hidden, so its presence is also the assertion that include-hidden-files is
          # still set on the upload.
          placeholders=/tmp/compose/fixture-compose/.placeholders.env
          test -f "$placeholders"
          for name in IMAGE_PREFIX IMAGE_TAG FIXTURE_MESSAGE; do
            grep -qE "^$name=" "$placeholders" || {
              echo "::error::$name missing from .placeholders.env"; exit 1; }
          done

  # One required check covering the whole file. Its NAME is load-bearing: the
  # main-protection ruleset requires a status check named exactly "Tests pass", so a job
  # named anything else never reports that context and the pull request stays blocked.
  #
  # if: always() so a failed job above is reported here as a failure rather than leaving
  # the required check Pending forever.
  tests-pass:
    name: Tests pass
    if: always()
    needs: [call, assert]
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job passed
        env:
          CALL: ${{ needs.call.result }}
          ASSERT: ${{ needs.assert.result }}
        run: |
          set -euo pipefail
          echo "call=$CALL assert=$ASSERT"
          test "$CALL" = 'success'
          test "$ASSERT" = 'success'
