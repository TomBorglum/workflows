name: Update pixi dependencies

# Upgrades a pixi workspace's dependencies and opens a pull request with the result.
# README.md documents the caller contract.
#
# The pull request is opened as a GitHub App, never with GITHUB_TOKEN: an event created
# with GITHUB_TOKEN triggers no further workflow run, so the caller's own required checks
# would never run on the pull request this opens.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory holding both the .envrc that declares the pixi version and the
          pixi.toml to upgrade. They live together in a pixi workspace, so this is one
          input rather than two.
        type: string
        required: false
        default: '.'
      pinning-strategy:
        description: >-
          How pixi rewrites each version constraint it upgrades. Passed through to the
          action, and from there to `pixi upgrade --pinning-strategy`, which owns the
          list of valid values. The default, exact-version, is what makes the pull
          request a reviewable statement of exactly what moved.
        type: string
        required: false
        default: 'exact-version'
      branch:
        description: Branch the pull request is opened from.
        type: string
        required: false
        default: 'deps/pixi'
      base:
        description: >-
          Branch the pull request targets. Empty means the branch that is checked out,
          which is create-pull-request's own default and right for a scheduled caller.
          A caller triggered by `pull_request` or `release` is in detached HEAD and MUST
          set this, or create-pull-request cannot rebase the change.
        type: string
        required: false
        default: ''
      stub-directives:
        description: >-
          Whitespace-separated directive names for direnv/setup to define as no-ops.
          direnv/setup rejects an .envrc that uses a directive it does not define, so an
          .envrc declaring anything beyond `use pixi`, `use fnm`, `use sdk` and direnv's
          own built-ins needs its extra directives named here to evaluate on a runner.
        type: string
        required: false
        default: ''
      dry-run:
        description: >-
          Perform the upgrade and report what moved, but open no pull request. Needs
          neither secret, so it is also how this workflow is tested. The result is in the
          job summary and in the outputs below.
        type: boolean
        required: false
        default: false
    secrets:
      app-client-id:
        description: >-
          The Client ID of a GitHub App installed on the calling repository, with
          Contents: read/write and Pull requests: read/write. This is the App's Client ID
          (App settings -> General -> Client ID), not the numeric App ID. Required unless
          dry-run is true.
        required: false
      app-private-key:
        description: >-
          A private key generated for that same App. Required unless dry-run is true.
        required: false
    outputs:
      changed:
        description: >-
          'true' when the upgrade rewrote pixi.toml or pixi.lock, 'false' otherwise.
        value: ${{ jobs.update.outputs.changed }}
      summary:
        description: >-
          Markdown table of what moved (package, from, to). Empty when nothing changed.
        value: ${{ jobs.update.outputs.summary }}
      pull-request-number:
        description: >-
          Number of the pull request that was created or updated. Empty when nothing
          changed, or on a dry run.
        value: ${{ jobs.update.outputs.pull-request-number }}
      pull-request-url:
        description: >-
          URL of that pull request. Empty under the same conditions as the number.
        value: ${{ jobs.update.outputs.pull-request-url }}

# Every write below goes through the App token, which this block does not govern.
# Declared narrowly so a caller that granted less fails loudly.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upgrade.outputs.changed }}
      summary: ${{ steps.upgrade.outputs.summary }}
      pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
      pull-request-url: ${{ steps.cpr.outputs.pull-request-url }}
    steps:
      # Fail here rather than four steps later, naming this workflow and the missing
      # secret. A `run:` test rather than an `if:` because a secret cannot be referenced
      # in an `if:` at all, hence the env indirection; unset arrives as the empty string.
      - name: Require the App credentials unless this is a dry run
        if: ${{ !inputs.dry-run }}
        env:
          CLIENT_ID: ${{ secrets.app-client-id }}
          PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          set -euo pipefail
          missing=''
          [[ -n "$CLIENT_ID" ]] || missing='app-client-id'
          [[ -n "$PRIVATE_KEY" ]] || missing="${missing:+$missing, }app-private-key"
          if [[ -n "$missing" ]]; then
            echo "update-pixi-dependencies: missing secret(s): $missing" >&2
            echo "This workflow opens its pull request as a GitHub App, so both" >&2
            echo "app-client-id and app-private-key must be passed in the calling" >&2
            echo "job's secrets: block. Set dry-run: true to upgrade and report" >&2
            echo "without opening a pull request, which needs neither secret." >&2
            exit 1
          fi

      - name: Mint a GitHub App installation token
        id: app-token
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      # A skipped step's output is the empty string, so a dry run falls through to
      # github.token and still checks out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Install pixi from the workspace's .envrc
        uses: TomBorglum/actions/direnv/setup@f3028cddd68f2efc77b63a3f4fd749e541c8701c # v3.1.0
        with:
          working-directory: ${{ inputs.working-directory }}
          stub-directives: ${{ inputs.stub-directives }}

      - name: Upgrade pixi dependencies
        id: upgrade
        uses: TomBorglum/actions/pixi/upgrade-dependencies@f3028cddd68f2efc77b63a3f4fd749e541c8701c # v3.1.0
        with:
          working-directory: ${{ inputs.working-directory }}
          pinning-strategy: ${{ inputs.pinning-strategy }}

      # The two files the upgrade is allowed to have touched, so nothing else in the
      # checkout can reach the pull request. README.md states what that excludes.
      # The prefix collapses for a '.' working directory, so the pathspec reads
      # `pixi.toml` rather than `./pixi.toml`.
      - name: Resolve the paths to commit
        id: paths
        if: ${{ steps.upgrade.outputs.changed == 'true' }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          dir="${WORKING_DIRECTORY%/}"
          prefix=''
          if [[ -n "$dir" && "$dir" != '.' ]]; then
            prefix="${dir#./}/"
          fi
          # The documented {name}<<{delimiter} form with a random delimiter, so a crafted
          # working-directory cannot close the heredoc early and forge another output.
          delimiter="ADD_PATHS_EOF_$(openssl rand -hex 16)"
          {
            printf 'add-paths<<%s\n' "$delimiter"
            printf '%spixi.toml\n%spixi.lock\n' "$prefix" "$prefix"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # The job summary is the entire payload of a dry run.
      - name: Report what moved
        env:
          CHANGED: ${{ steps.upgrade.outputs.changed }}
          SUMMARY: ${{ steps.upgrade.outputs.summary }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          {
            echo '## pixi dependency upgrade'
            echo
            if [[ "$CHANGED" == 'true' ]]; then
              echo "$SUMMARY"
              if [[ "$DRY_RUN" == 'true' ]]; then
                echo
                echo '_Dry run: no pull request was opened._'
              fi
            else
              echo 'Nothing to upgrade; no pull request needed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # No bot identity is resolved here because `sign-commits` below makes the action
      # ignore the committer and author inputs.
      - name: Create pull request
        id: cpr
        if: ${{ !inputs.dry-run && steps.upgrade.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          add-paths: ${{ steps.paths.outputs.add-paths }}
          branch: ${{ inputs.branch }}
          base: ${{ inputs.base }}
          delete-branch: true
          commit-message: "deps: update pixi dependencies"
          title: "deps: update pixi dependencies"
          body: |
            Automated pixi dependency upgrade. Dependabot has no pixi ecosystem, so this
            is what bumps the versions declared in `pixi.toml`.

            ${{ steps.upgrade.outputs.summary }}

            Produced by
            [`TomBorglum/workflows/.github/workflows/update-pixi-dependencies.yml`](https://github.com/TomBorglum/workflows/blob/main/.github/workflows/update-pixi-dependencies.yml),
            which upgraded the workspace with the pixi this repository's own `.envrc`
            pins and committed only `pixi.toml` and `pixi.lock`.
