name: Release Please

# Authenticates as the tomborglum-workflows-bot GitHub App, never with GITHUB_TOKEN: an
# event created with GITHUB_TOKEN triggers no further workflow run, so the release pull
# request would never run the required SonarCloud gate and could never satisfy
# main-protection.
#
# The App is installed on this repository alone, so a leaked private key reaches nothing
# else. It needs Contents: read/write (branch, tag, release), Pull requests: read/write
# and Issues: read/write (the autorelease:* labels), and two repository secrets:
# AUTOMATION_APP_CLIENT_ID and AUTOMATION_APP_PRIVATE_KEY. A missing or empty one fails
# the token step with "The 'client-id' (or deprecated 'app-id') input must be set to a
# non-empty string".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sufficient although release-please-action's README asks for more: every API call below
# goes through the App token, and actions/checkout is handed it explicitly.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          # The App's Client ID, which is neither the deprecated app-id input nor the
          # numeric App ID. README.md says where to read it.
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below maintains the moving major and minor tags. CONTRIBUTING.md
      # states that contract.
      #
      # `release_created` is set only when a release happened and is never written false,
      # which is what makes the bare truthiness check below correct.
      #
      # A manual run moves them against the newest `vX.Y.Z` tag instead. That is the
      # recovery path for a release whose tag push failed: the release and its exact tag
      # already exist, so re-running the push event would report no release and skip
      # these steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        with:
          # Full history: the tags being moved may point anywhere in it.
          fetch-depth: 0
          # Persist the App token, so the `git push` below is authenticated as the App.
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve the bot's tagger identity
        id: bot
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # The slug is an action output; the numeric user id the noreply address needs
          # is not.
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Move the major and minor tags
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        env:
          NAME: ${{ steps.bot.outputs.name }}
          EMAIL: ${{ steps.bot.outputs.email }}
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          set -euo pipefail

          git config user.name  "$NAME"
          git config user.email "$EMAIL"

          # Empty on a manual run, where release-please reports no release.
          if [[ -z "$SHA" ]]; then
            released="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            if [[ ! "$released" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              echo "::error::No vX.Y.Z tag to move the major and minor tags to (found '${released}')"
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            SHA="$(git rev-list -n 1 "$released")"
            echo "Moving the tags for ${released} (${SHA})"
          fi

          # Only vX and vX.Y move; the exact vX.Y.Z is never touched again. The
          # version-tags ruleset covers all of `v*`, so the force-push below works
          # because this App is its only bypass actor, not because these fall outside it.
          for tag in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
            # Present but pointing elsewhere is still moved: a patch release that failed
            # this step left vX.Y stale rather than missing.
            current="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
            if [[ "$current" == "$SHA" ]]; then
              echo "${tag} already points at ${SHA}"
              continue
            fi

            git tag -f -a "$tag" -m "Release $tag" "$SHA"

            # GitHub has rejected one of these pushes with `[remote rejected] (failed)`,
            # no reason and a rule suite that recorded the bypass as allowed:
            # https://github.com/TomBorglum/workflows/actions/runs/43434401312
            for attempt in 1 2 3; do
              if git push --force origin "refs/tags/$tag"; then
                break
              fi
              if (( attempt == 3 )); then
                echo "::error::Pushing ${tag} failed three times"
                exit 1
              fi
              sleep $(( attempt * 5 ))
            done
          done
