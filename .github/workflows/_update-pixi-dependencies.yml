name: Update pixi dependencies

# Calls update-pixi-dependencies.yml by local path, so main's version runs rather than a
# released tag. What it bumps is the check-jsonschema pin that docker-hub-publish.yml
# provides to every consumer's `meta` job.
#
# A schedule fires from the default branch alone, so this does nothing until it is merged.
# The secrets are the tomborglum-workflows-bot App _release-please.yml already uses;
# nothing further is provisioned. Every input is left at its default.

on:
  schedule:
    # A missed run is a week's delay, not a lost upgrade: the next run upgrades to
    # whatever is current and updates the same branch.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: ./.github/workflows/update-pixi-dependencies.yml
    secrets:
      app-client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
