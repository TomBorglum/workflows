name: Docker Hub publish

# Builds, scans and publishes one image per directory its config file declares, then publishes
# one OCI compose artifact per compose project the same file declares. Called, never triggered.
# docs/docker-hub-publish.md is the caller's reference; README.md documents the config file.
#
# Three invariants. Breaking any of them is a security regression:
#   - No job that checks the repository out gets `id-token: write`.
#   - Nothing here reads `vars` or names an AWS object.
#   - No checkout step is added to resolve a TomBorglum/actions reference. The runner fetches
#     those into its own action cache, never into GITHUB_WORKSPACE.
# The logs are world-readable, so nothing added may print the account id or the PAT.

# Every `github.*` reference below resolves to the caller's event.
on:
  workflow_call:
    inputs:
      config:
        description: >-
          Path to the YAML file declaring the images and compose projects this repository
          publishes, relative to the repository root. README.md documents every key.
        required: false
        default: .github/docker-hub-publish.yml
        type: string
      aws-region:
        description: >-
          The region the release role is assumed in and the Docker Hub PAT parameter is
          read from.
        required: true
        type: string
      aws-ssm-parameter:
        description: >-
          The SSM Parameter Store path holding the Docker Hub PAT, read with
          --with-decryption. Must be a SecureString, and must be the literal ARN the release
          role's inline policy names: the policy grants ssm:GetParameter on one parameter
          rather than a prefix, so any other path is refused. Not a secret: the value it
          points at never leaves the step that reads it.
        required: true
        type: string
      dockerhub-namespace:
        description: >-
          The Docker Hub namespace every image publishes under, and the account `push`
          logs in as. Must be the account the PAT above belongs to, which nothing checks.
        required: true
        type: string
    secrets:
      aws-role-arn:
        description: >-
          The IAM role `push` assumes with this workflow's OIDC token, as a full ARN. Its
          trust policy must accept this workflow's job_workflow_ref claim and its inline
          policy must grant ssm:GetParameter on the parameter above. A secret rather than an
          input so the account id inside it is masked.
        required: true

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub-namespace }}

jobs:
  # Tags and labels derived once, so no image and its metadata can disagree with another's.
  meta:
    runs-on: ubuntu-latest
    env:
      # Declared once for both derivations below, so a release cannot tag a compose file
      # differently from the images that file names. A `with:` reads the `env` context, which
      # is what lets one declaration serve both; a YAML anchor would not. The semver patterns
      # resolve only on a tag ref, so a pull_request run yields the sha tag alone.
      TAG_PATTERNS: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,format=long
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
    outputs:
      image-tags: ${{ steps.meta-images.outputs.tags }}
      image-repositories: ${{ steps.images.outputs.image-map }}
      compose-tags: ${{ steps.meta-compose.outputs.tags }}
      compose-repositories: ${{ steps.images.outputs.compose-map }}
      image-prefix: ${{ steps.images.outputs.image-prefix }}
      bake-labels: ${{ steps.bake.outputs.labels }}
      bake-annotations: ${{ steps.bake.outputs.annotations }}
      # JSON arrays, because `strategy` resolves the matrix through `fromJSON`.
      image-directories: ${{ steps.images.outputs.image-directories }}
      compose-directories: ${{ steps.images.outputs.compose-directories }}
      trivyignores: ${{ steps.images.outputs.trivyignores }}
      vex-documents: ${{ steps.images.outputs.vex-documents }}
      vulnerability-gate: ${{ steps.images.outputs.vulnerability-gate }}
    steps:
      # The matrix needs the config as a job output, and the filesystem checks below need the
      # repository. Nothing checked out in this job is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow's own source, for the schema and the validator: `actions/checkout` in a
      # called workflow checks out the caller, and `job.workflow_sha` is what makes a caller
      # pinned to @v2.0.0 validate against v2.0.0's schema. Nothing here is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      # From the pixi workspace in the checkout above, never the runner image.
      - name: Provide the config validator
        uses: TomBorglum/actions/direnv/setup@e28b4a48eb5d290f75bd764e076331ab58e7988e # v3.2.0
        with:
          working-directory: workflow-source

      # Shape, before anything reads through it. The `images` step below keeps only the
      # checks a schema cannot make, which are the ones about the filesystem.
      - name: Validate the config against the schema
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [ ! -f "$CONFIG" ]; then
            echo "::error::config file not found: $CONFIG"
            exit 1
          fi

          # One annotation per error. The validator reports no line number, so the JSON
          # path travels in the message and `line` keeps its default of 1.
          if check-jsonschema -o json \
            --schemafile workflow-source/schema/docker-hub-publish.json \
            "$CONFIG" > /tmp/validation.json; then
            echo "$CONFIG matches the schema"
            exit 0
          fi

          # A crash writes nothing jq can read, which must not surface as "no errors found".
          if ! jq -e 'type == "object"' /tmp/validation.json > /dev/null 2>&1; then
            echo "::error::check-jsonschema produced no readable result for $CONFIG"
            cat /tmp/validation.json
            exit 1
          fi
          jq -r --arg f "$CONFIG" '
            (.parse_errors[]? | "::error file=\($f),title=Config parse error::\(.message)"),
            (.errors[]? | "::error file=\($f),title=Config schema error::\(.path): \(.message)")
          ' /tmp/validation.json
          jq '.' /tmp/validation.json
          exit 1

      # The image name is composed here and nowhere else: <namespace>/<repository>-<dir>, read
      # back from `image-list` and `image-map` so no consumer can spell one differently.
      # `image-list` is comma-joined because metadata-action splits `images` on newlines only.
      - name: Read the config and compose the repository each directory publishes to
        id: images
        env:
          CONFIG: ${{ inputs.config }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # `required` is satisfied by a key being present, and an unset variable arrives
          # as the empty string. Not in the schema, which governs the config file alone.
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            fail "dockerhub-namespace must be lowercase letters, digits, - or _, got: '$DOCKERHUB_NAMESPACE'"
          fi

          # A missing binary would otherwise surface as a jq parse error on an empty file.
          command -v yq > /dev/null || fail "yq is not on PATH"
          # One conversion, so every read below is jq rather than two query languages. The
          # shape is validated above, so nothing here re-checks a type or an enum.
          yq -o=json '.' "$CONFIG" > /tmp/config.json

          # `keys_unsorted`, so the file's order is the matrix's order. Duplicate keys are a
          # YAML error, which is why both collections are mappings rather than lists.
          jq -r '.images.directories | keys_unsorted[]' /tmp/config.json > /tmp/image-directories
          jq -r '.["compose-projects"] // {} | keys_unsorted[]' /tmp/config.json \
            > /tmp/compose-directories

          # What the schema cannot know: the filesystem. Before any image is built, because a
          # mistyped suppression path reaching the scan suppresses nothing and says nothing.
          while read -r directory; do
            [ -d "$directory" ] || fail "images.directories.$directory: no such directory"
            for required in Dockerfile docker-bake.hcl; do
              [ -f "$directory/$required" ] \
                || fail "images.directories.$directory: $directory/$required not found"
            done
            for key in trivyignores vex-documents; do
              # `// []` covers a directory declaring nothing, which is null here.
              jq -r --arg d "$directory" --arg k "$key" \
                '((.images.directories[$d] // {})[$k] // [])[]' /tmp/config.json \
                > /tmp/suppression-paths
              while read -r path; do
                [ -f "$directory/$path" ] \
                  || fail "images.directories.$directory.$key: $directory/$path not found"
              done < /tmp/suppression-paths
            done
          done < /tmp/image-directories

          while read -r directory; do
            [ -n "$directory" ] || continue
            [ -d "$directory" ] || fail "compose-projects.$directory: no such directory"
            [ -f "$directory/compose.yaml" ] \
              || fail "compose-projects.$directory: $directory/compose.yaml not found"
          done < /tmp/compose-directories

          # Read rather than checked: the schema has already refused every other value.
          gate="$(jq -r '.images.gates.vulnerability // "always"' /tmp/config.json)"
          printf 'vulnerability-gate=%s\n' "$gate" >> "$GITHUB_OUTPUT"

          # The prefix every name below is built on, and what `push` exports as IMAGE_PREFIX.
          prefix="$DOCKERHUB_NAMESPACE/$REPOSITORY"
          printf 'image-prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"

          # Always written, the empty compose case included: an output evaluating to the empty
          # string is not set at all, and `fromJSON` on an unset output fails the run.
          jq -c '.images.directories | keys_unsorted' /tmp/config.json \
            | sed 's/^/image-directories=/' >> "$GITHUB_OUTPUT"
          jq -c '.["compose-projects"] // {} | keys_unsorted' /tmp/config.json \
            | sed 's/^/compose-directories=/' >> "$GITHUB_OUTPUT"

          # Each image's own paths, prefixed with its directory because that is what they
          # resolve against, then comma-joined for `trivyignores` and TRIVY_VEX. The config
          # file refuses a comma inside an element, so the join happens here and nowhere else.
          for key in trivyignores vex-documents; do
            jq -c --arg k "$key" '
              .images.directories
              | with_entries(
                  .value = (.key as $d
                            | ((.value // {})[$k] // [])
                            | map("\($d)/\(.)")
                            | join(","))
                )
            ' /tmp/config.json | sed "s/^/$key=/" >> "$GITHUB_OUTPUT"
          done

          jq -r --arg p "$prefix" '.images.directories | keys_unsorted
            | map("\($p)-\(.)") | join(",")' \
            /tmp/config.json | sed 's/^/image-list=/' >> "$GITHUB_OUTPUT"
          jq -c --arg p "$prefix" '.images.directories | keys_unsorted
            | map({key: ., value: "\($p)-\(.)"}) | from_entries' \
            /tmp/config.json | sed 's/^/image-map=/' >> "$GITHUB_OUTPUT"
          jq -r --arg p "$prefix" '.["compose-projects"] // {} | keys_unsorted
            | map("\($p)-\(.)") | join(",")' \
            /tmp/config.json | sed 's/^/compose-list=/' >> "$GITHUB_OUTPUT"
          jq -c --arg p "$prefix" '.["compose-projects"] // {} | keys_unsorted
            | map({key: ., value: "\($p)-\(.)"}) | from_entries' \
            /tmp/config.json | sed 's/^/compose-map=/' >> "$GITHUB_OUTPUT"

          jq -r --arg p "$prefix" '
            [(.images.directories | keys_unsorted[]),
             (.["compose-projects"] // {} | keys_unsorted[])][]
            | "\(.) -> \($p)-\(.)"' /tmp/config.json

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-images
        with:
          # Not the action's own default, which no bake file declares.
          bake-target: image
          # Every image, so one derivation serves them all; `push` selects each by its
          # `<image>:` prefix.
          images: ${{ steps.images.outputs.image-list }}
          flavor: latest=false
          tags: ${{ env.TAG_PATTERNS }}

      # Derived separately rather than as further names above: `push` diffs the artifacts'
      # repositories against the derived tags, and a compose file has no image artifact.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-compose
        if: steps.images.outputs.compose-directories != '[]'
        with:
          images: ${{ steps.images.outputs.compose-list }}
          flavor: latest=false
          tags: ${{ env.TAG_PATTERNS }}

      # These files land in this runner's temp directory, so their contents travel rather
      # than their paths. One line each: a `<<` delimiter stops this file highlighting.
      - name: Carry the bake overrides to the build job
        id: bake
        env:
          LABELS_FILE: ${{ steps.meta-images.outputs.bake-file-labels }}
          ANNOTATIONS_FILE: ${{ steps.meta-images.outputs.bake-file-annotations }}
        run: |
          set -euo pipefail
          [ -s "$LABELS_FILE" ] && [ -s "$ANNOTATIONS_FILE" ]
          printf 'labels=%s\n' "$(tr -d '\n' < "$LABELS_FILE")" >> "$GITHUB_OUTPUT"
          printf 'annotations=%s\n' "$(tr -d '\n' < "$ANNOTATIONS_FILE")" >> "$GITHUB_OUTPUT"
          cat "$LABELS_FILE" "$ANNOTATIONS_FILE"

  # The untrusted job: it runs the repository's own build tooling, which `compose`, the
  # other job that checks out, does not. No `id-token` in either - see the header.
  build:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every image gets scanned even when one fails, so one run lists every finding.
      fail-fast: false
      matrix:
        # `strategy` reads `github`, `needs`, `vars` and `inputs` only, never `env` and never
        # `steps`. A file is not among them, which is why `meta` checks out and parses the
        # config into this output.
        directory: ${{ fromJSON(needs.meta.outputs.image-directories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A job holding repository code must not also hold a credential for it.
          persist-credentials: false

      - name: Stage the shared bake overrides
        env:
          LABELS: ${{ needs.meta.outputs.bake-labels }}
          ANNOTATIONS: ${{ needs.meta.outputs.bake-annotations }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bake
          printf '%s\n' "$LABELS" > /tmp/bake/labels.json
          printf '%s\n' "$ANNOTATIONS" > /tmp/bake/annotations.json

      # For the docker-container driver: attestations and the type=oci exporter are
      # BuildKit features the default docker driver does not implement.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the ${{ matrix.directory }} image
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          # What the directory's bake file expects, and what a caller's own local build
          # task passes too, so CI and a workstation build the same image.
          source: ${{ matrix.directory }}
          # Order is load-bearing and nothing reports it: the last file wins the keys it names.
          files: |
            /tmp/bake/labels.json
            /tmp/bake/annotations.json
            docker-bake.hcl
          targets: image
          # Exported, not pushed: the archive is what crosses into the job holding the
          # registry credential. `set` rather than declared in the bake file, because
          # where the artifact lands is this workflow's decision, not the directory's.
          set: |
            image.output=type=oci,dest=/tmp/image.oci.tar
          # Spelled out because `provenance: true` would leave BuildKit's own `mode=min` in
          # force. docs/docker-hub-publish.md records what mode=max publishes.
          provenance: mode=max
          sbom: true

      # trivy reads an OCI layout directory and rejects the tarred one. `tar -xf` rather
      # than `regctl image import`: import leads index.json with a referrers index, trivy
      # reads the first entry only, and the scan then reports SUCCESS having found nothing.
      - name: Unpack the OCI layout
        run: |
          set -euo pipefail
          mkdir -p /tmp/oci
          tar -xf /tmp/image.oci.tar -C /tmp/oci

      # TRIVY_VEX is a string list, so an empty value reads as one source whose path is the
      # empty string and trivy fails opening it. Hence a guarded step, not an `env:` below.
      - name: Select the VEX sources for Trivy to use
        if: fromJSON(needs.meta.outputs.vex-documents)[matrix.directory] != ''
        env:
          VEX_DOCUMENTS: ${{ fromJSON(needs.meta.outputs.vex-documents)[matrix.directory] }}
        run: printf 'TRIVY_VEX=%s\n' "$VEX_DOCUMENTS" >> "$GITHUB_ENV"

      - name: Scan the ${{ matrix.directory }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          scan-type: image
          input: /tmp/oci
          scanners: vuln
          severity: HIGH,CRITICAL
          # Empty is safe here, unlike TRIVY_VEX: no --ignorefile is passed for an empty input.
          trivyignores: ${{ fromJSON(needs.meta.outputs.trivyignores)[matrix.directory] }}
          format: json
          output: /tmp/trivy.json
          exit-code: 0

      # Two checks and a report, because a passing trivy run does not mean this image was
      # scanned. `images.gates.vulnerability` relaxes the vulnerability check only: relaxing
      # the wrong-image check would let a scan of the wrong thing read as a clean image.
      - name: Gate on the scan
        env:
          DIRECTORY: ${{ matrix.directory }}
          VULNERABILITY_GATE: ${{ needs.meta.outputs.vulnerability-gate }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # The platform is what tells an image config from the empty `{}` the attestation
          # manifest also puts in this layout: `{}` declares none.
          config="$(jq -r '.Metadata.ImageID // ""' /tmp/trivy.json)"
          blob="/tmp/oci/blobs/sha256/${config#sha256:}"
          platform="$(jq -r '[.os, .architecture]
                             | if any(. == null) then "" else join("/") end' \
                         "$blob" 2>/dev/null || true)"
          if [ -z "$platform" ]; then
            echo "::error::trivy reported $config for the $DIRECTORY image, which is no image config in the layout it scanned, so it scanned something else."
            jq '{Metadata: .Metadata, Targets: [.Results[]?.Target]}' /tmp/trivy.json
            exit 1
          fi
          echo "scanned $DIRECTORY: $config ($platform)"

          printf '### %s image\n\n' "$DIRECTORY" >> "$GITHUB_STEP_SUMMARY"

          # `.Type` is filtered because the field carries every class of modified finding, so
          # a scanner added here later would otherwise land in this table. `[]?` throughout
          # because trivy omits the key entirely when nothing was suppressed.
          suppressed="$(jq -r '.Results[]?.ExperimentalModifiedFindings[]?
                               | select(.Type == "vulnerability")
                               | [.Finding.Severity, .Finding.VulnerabilityID,
                                  "\(.Finding.PkgName) \(.Finding.InstalledVersion)",
                                  .Status, .Source, (.Statement // "")]
                               | @tsv' /tmp/trivy.json)"
          if [ -n "$suppressed" ]; then
            suppressed_count="$(printf '%s\n' "$suppressed" | wc -l)"
            printf '%s suppressed HIGH or CRITICAL finding(s):\n' "$suppressed_count"
            printf '%s\n' "$suppressed"
            {
              printf '%s suppressed HIGH or CRITICAL finding(s), accepted by this image via its `trivyignores` or `vex-documents`.\n\n' "$suppressed_count"
              printf '| Severity | ID | Package | Status | Source | Statement |\n'
              printf '| --- | --- | --- | --- | --- | --- |\n'
              # A `|` in a statement would end its cell. Escaped here rather than in jq,
              # where it would reach the step log above too.
              printf '%s\n' "$suppressed" | sed 's/|/\\|/g' \
                | awk -F'\t' '{printf "| %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6}'
              printf '\n'
            } >> "$GITHUB_STEP_SUMMARY"
            # A notice, not a warning: a repository holding one standing acceptance would
            # otherwise warn on every build.
            echo "::notice::$suppressed_count suppressed HIGH or CRITICAL finding(s) in the $DIRECTORY image, accepted by its trivyignores or vex-documents."
          else
            echo "nothing suppressed"
            printf 'Nothing suppressed.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          findings="$(jq -r '.Results[]?.Vulnerabilities[]?
                             | [.Severity, .VulnerabilityID,
                                "\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"]
                             | @tsv' /tmp/trivy.json)"
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings"
            count="$(printf '%s\n' "$findings" | wc -l)"
            {
              printf '%s HIGH or CRITICAL finding(s).\n\n' "$count"
              printf '| Severity | ID | Package |\n| --- | --- | --- |\n'
              printf '%s\n' "$findings" | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}'
              printf '\n'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$VULNERABILITY_GATE" = 'release' ] && [ "$EVENT" = 'pull_request' ]; then
              printf 'Advisory on a pull request. The release gate blocks on these.\n\n' \
                >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$count HIGH or CRITICAL finding(s) in the $DIRECTORY image, advisory on a pull request."
              exit 0
            fi
            echo "::error::$count HIGH or CRITICAL finding(s) in the $DIRECTORY image."
            exit 1
          fi
          echo "no HIGH or CRITICAL findings"
          printf 'No HIGH or CRITICAL findings.\n\n' >> "$GITHUB_STEP_SUMMARY"

      # Both travel with the archive, so `push` needs no list of its own and can prove
      # nothing changed in transit.
      - name: Stage the image artifact
        env:
          # Staged so the test workflow can assert this leg got its own paths and not another
          # image's: nothing else crosses the job boundary to prove it.
          TRIVYIGNORES: ${{ fromJSON(needs.meta.outputs.trivyignores)[matrix.directory] }}
          VEX_DOCUMENTS: ${{ fromJSON(needs.meta.outputs.vex-documents)[matrix.directory] }}
          # bake-action reports one entry per target rather than a bare digest.
          DIGEST: ${{ fromJSON(steps.build.outputs.metadata).image['containerimage.digest'] }}
          # Read back out of `meta`, not recomposed: the formula lives in one step.
          IMAGE: ${{ fromJSON(needs.meta.outputs.image-repositories)[matrix.directory] }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          mv /tmp/image.oci.tar /tmp/out/image.oci.tar
          printf '%s\n' "$DIGEST" > /tmp/out/digest
          printf '%s\n' "$IMAGE" > /tmp/out/repository
          printf '%s\n' "$TRIVYIGNORES" > /tmp/out/trivyignores
          printf '%s\n' "$VEX_DOCUMENTS" > /tmp/out/vex-documents
          head -v /tmp/out/digest /tmp/out/repository /tmp/out/trivyignores /tmp/out/vex-documents

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.directory }}
          path: /tmp/out/
          retention-days: 1
          if-no-files-found: error

  # `push` checks nothing out, so this job checks every compose directory out on its behalf -
  # the second job running repository code, hence no `id-token: write`. No `if:`: a job that
  # always runs never skips, which is what lets `push` keep a plain `needs` gate on empty
  # input.
  compose:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A job holding repository code must not also hold a credential for it.
          persist-credentials: false

      - name: Validate and stage every compose directory
        env:
          COMPOSE_DIRECTORIES: ${{ needs.meta.outputs.compose-directories }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          docker compose version
          # Experimental when it was added, so a runner whose compose predates it would
          # otherwise fail a release at its very last step.
          docker compose publish --help > /dev/null
          mkdir -p /tmp/compose-files
          # Always written, empty input included, so the artifact is never empty.
          printf '%s' "$COMPOSE_DIRECTORIES" | jq -r '.[]' \
            > /tmp/compose-files/directories
          while read -r directory; do
            [ -n "$directory" ] || continue
            # Nesting composes a three-component Hub repository, and a project name whose
            # silently stripped slash collides with the flat spelling.
            case "$directory" in
              */*)
                echo "::error::compose directory $directory must not be nested."
                exit 1 ;;
              # Required by SonarCloud's default-case rule; the `case` already fell through.
              *) ;;
            esac
            # The declared key, not `config`'s resolved `.name`, which would accept a
            # COMPOSE_PROJECT_NAME override. docs/docker-hub-publish.md states the formula.
            expected="$REPOSITORY-$directory"
            declared="$(sed -n 's/^name:[[:space:]]*//p' "$directory/compose.yaml" \
              | head -1 | tr -d "\"' ")"
            if [ "$declared" != "$expected" ]; then
              echo "::error::$directory/compose.yaml names the project" \
                "'${declared:-nothing}', expected '$expected'."
              exit 1
            fi
            # The whole directory, so a caller keeping an .env beside its compose
            # file gets it staged and published in the artifact alongside.
            mkdir -p "/tmp/compose-files/$directory"
            cp -R "$directory/." "/tmp/compose-files/$directory/"
            docker compose -f "$directory/compose.yaml" --profile '*' config --variables \
              --format json > /tmp/variables.json
            # A bare ${...} renders an empty string and says nothing, where a `:?` fails
            # naming the variable. docs/docker-hub-publish.md states what is published.
            for name in $(jq -r 'to_entries[]
              | select(.value.Required | not)
              | select(.value.DefaultValue == "") | .key' /tmp/variables.json); do
              echo "::error::$directory/compose.yaml leaves \$$name unguarded" \
                "and gives it no default."
              exit 1
            done
            # Every name, listed without resolving any, so this reads a file nothing can
            # render. `--env-file` turns .env auto-loading off and the later file wins, so
            # the directory's own declarations outrank these placeholders.
            jq -r 'keys[] | "\(.)=release-workflow-placeholder"' /tmp/variables.json \
              > "/tmp/compose-files/$directory/.placeholders.env"
            set -- --env-file "/tmp/compose-files/$directory/.placeholders.env"
            [ -f "$directory/.env" ] && set -- "$@" --env-file "$directory/.env"
            # `*` rather than a profile named here: a compose file's profiles are its
            # own business, and `config` renders only the services a profile selects.
            docker compose "$@" -f "$directory/compose.yaml" --profile '*' config --quiet
            echo "staged $directory"
          done < /tmp/compose-files/directories

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-files
          path: /tmp/compose-files/
          # The .env and placeholder files, which are excluded by default.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The trusted job. It checks nothing out: everything that runs in it is either a
  # SHA-pinned action or a `run` block written in this file. aws/assume-role's scripts are
  # part of that trusted surface; its pin decides which version of them runs.
  push:
    needs: [meta, build, compose]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one rather than merging, so
      # contents: read is restated deliberately.
      contents: read
      id-token: write
    steps:
      # First, so a bad parameter path fails before anything is downloaded. The SSM path is
      # the one value aws/assume-role takes no input for, so this is the only step that can
      # check it. No message echoes the value it rejected.
      - name: Check the SSM parameter path
        env:
          AWS_SSM_PARAMETER: ${{ inputs.aws-ssm-parameter }}
        run: |
          set -euo pipefail
          if [[ ! "$AWS_SSM_PARAMETER" =~ ^/[A-Za-z0-9./_-]+$ ]]; then
            echo "::error::aws-ssm-parameter must be an absolute SSM parameter path"
            exit 1
          fi
          echo "parameter path well-formed"

      # Untrusted bytes, safe here because nothing in this job executes them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-files
          path: /tmp/compose-files

      # Before regctl-installer, and load-bearing: that installer verifies its download
      # against regclient's cosign signature only `if [ -x "$(command -v cosign)" ]`.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          # Pinned, not the action's `latest`: this binary runs while the credential is live.
          release: v0.11.7

      # Here, not earlier: the downloads and installers above run before the credential
      # exists, so its live window is only as long as the steps that need it.
      - name: Assume the release role
        id: creds
        uses: TomBorglum/actions/aws/assume-role@e28b4a48eb5d290f75bd764e076331ab58e7988e # v3.2.0
        with:
          # A secret, because the runner echoes this `with:` block into the log before the
          # action runs: an input would publish the account id on every release.
          aws-role-arn: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          show-claims: true

      # The only step that touches the PAT, piped straight from SSM into `docker login`,
      # so it occupies no variable, output or file. regctl and cosign read what that wrote.
      - name: Read the Docker Hub PAT and log in
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          # Through `env` rather than the command text, which is a pipeline: a variable is
          # quoted once and cannot alter its shape.
          AWS_SSM_PARAMETER: ${{ inputs.aws-ssm-parameter }}
        run: |
          set -euo pipefail
          aws ssm get-parameter \
            --name "$AWS_SSM_PARAMETER" \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            | docker login docker.io --username "$DOCKERHUB_NAMESPACE" --password-stdin

      # All of them before any is copied, so an altered archive fails the release with
      # nothing published rather than half of it. The artifacts are what say which images
      # exist; no step in this job names a directory or a repository.
      - name: Stage every image and verify its digest
        env:
          TAGS: ${{ needs.meta.outputs.image-tags }}
        run: |
          set -euo pipefail

          # The glob below iterates its own literal text when nothing matches, so the
          # count is checked rather than assumed.
          set -- /tmp/images/image-*/
          if [ ! -d "$1" ]; then
            echo "::error::no image artifacts were downloaded, so there is nothing to publish."
            exit 1
          fi
          echo "$# image artifact(s) downloaded"

          for dir in /tmp/images/image-*/; do
            directory="${dir%/}"; directory="${directory##*/image-}"
            expected="$(cat "$dir/digest")"
            regctl image import "ocidir:///tmp/staged/$directory:staged" "$dir/image.oci.tar"
            actual="$(regctl manifest digest "ocidir:///tmp/staged/$directory:staged")"
            echo "$directory: $(cat "$dir/repository"), built $expected, staged $actual"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$directory digest changed between build and push."
              exit 1
            fi
          done

          # Both sides come from `meta`'s one composition step, so what this catches is a
          # count that disagrees - a build that uploaded nothing, an artifact that arrived
          # twice - either of which would publish a partial release quietly.
          cat /tmp/images/image-*/repository | sort -u > /tmp/staged-repositories
          printf '%s\n' "$TAGS" | sed -n 's/:[^:/]*$//p' \
            | sort -u > /tmp/tagged-repositories
          if ! diff -u /tmp/staged-repositories /tmp/tagged-repositories; then
            echo "::error::the images staged and the images the tags name are not the same set."
            exit 1
          fi

      # regctl copies the index byte for byte, which is what keeps one digest across the
      # scan, the push, the attestations and the signature, and it reads a local layout
      # where `docker buildx imagetools create` reads sources already in a registry.
      - name: Copy every image to Docker Hub
        env:
          TAGS: ${{ needs.meta.outputs.image-tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" > /tmp/tags
          for dir in /tmp/images/image-*/; do
            directory="${dir%/}"; directory="${directory##*/image-}"
            image="$(cat "$dir/repository")"
            matched=0
            while read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in "$image:"*) ;; *) continue ;; esac
              echo "copying $directory -> $ref"
              regctl image copy "ocidir:///tmp/staged/$directory:staged" "$ref"
              matched=$((matched + 1))
            done < /tmp/tags
            echo "$directory: $matched tag(s) published"
          done

      # After the copy above, which is why this step lives in this job at all:
      # --resolve-image-digests reads each digest back out of the registry. The shell
      # environment outranks both --env-file arguments below.
      - name: Publish every compose file to Docker Hub
        env:
          COMPOSE_TAGS: ${{ needs.meta.outputs.compose-tags }}
          COMPOSE_REPOSITORIES: ${{ needs.meta.outputs.compose-repositories }}
          # Read back out of `meta` rather than recomposed here.
          IMAGE_PREFIX: ${{ needs.meta.outputs.image-prefix }}
        run: |
          set -euo pipefail
          export IMAGE_PREFIX
          printf '%s\n' "$COMPOSE_TAGS" > /tmp/compose-tags
          : > /tmp/compose-digests
          files=0
          published=0
          # The manifest the `compose` job staged: a list, not a glob, and an empty
          # one is a release with no compose file rather than a failure.
          while read -r directory; do
            [ -n "$directory" ] || continue
            files=$((files + 1))
            repository="$(printf '%s' "$COMPOSE_REPOSITORIES" \
              | jq -r --arg d "$directory" '.[$d] // empty')"
            if [ -z "$repository" ]; then
              echo "::error::no repository was composed for $directory."
              exit 1
            fi
            last=""
            while read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in "$repository:"*) ;; *) continue ;; esac
              # The repository holds no port, so the last colon is the tag's.
              export IMAGE_TAG="${ref##*:}"
              echo "publishing $directory -> $ref, naming images at :$IMAGE_TAG"
              set -- --env-file "/tmp/compose-files/$directory/.placeholders.env"
              if [ -f "/tmp/compose-files/$directory/.env" ]; then
                set -- "$@" --env-file "/tmp/compose-files/$directory/.env"
              fi
              docker compose "$@" -f "/tmp/compose-files/$directory/compose.yaml" \
                publish "$ref" --resolve-image-digests --yes < /dev/null
              published=$((published + 1))
              last="$ref"
            done < /tmp/compose-tags
            # A derivation that yielded nothing would otherwise leave the images
            # published and no compose file describing them.
            if [ -z "$last" ]; then
              echo "::error::no tag was derived for $directory, so it was not published."
              exit 1
            fi
            # Read back from the registry: the signature below covers content, not a name.
            printf '%s@%s\n' "$repository" "$(regctl manifest digest "$last")" \
              >> /tmp/compose-digests
          done < /tmp/compose-files/directories
          echo "$files compose file(s), $published tag(s) published"
          cat /tmp/compose-digests

      # Keyless, reusing this job's own OIDC token. The digest is the index's, so one
      # signature covers the image and its attestations.
      - name: Sign every published digest
        run: |
          set -euo pipefail
          for dir in /tmp/images/image-*/; do
            cosign sign --yes "$(cat "$dir/repository")@$(cat "$dir/digest")"
          done
          # cosign signs a digest, so the artifact's media type is nothing it has to know.
          while read -r ref; do
            [ -n "$ref" ] || continue
            cosign sign --yes "$ref"
          done < /tmp/compose-digests

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io
