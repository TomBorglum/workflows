name: Update direnv dependencies

# Bumps the tool versions pinned by direnv's `use` directives in an .envrc and opens a
# pull request with the result. README.md documents the caller contract.
#
# One directive today, `use pixi`. The file is named for the directive family rather than
# the tool so that adding `use fnm` or `use sdk` is a step, not a rename - and renaming a
# reusable workflow is a hard break for every caller (CONTRIBUTING.md, "Naming workflow
# files").
#
# Nothing here installs or runs pixi: direnv/upgrade-pixi reads the directive and resolves
# the release, so the .envrc is never evaluated. That is why there is no direnv/setup step
# and no stub-directives input to pass it.
#
# The pull request is opened as a GitHub App, never with GITHUB_TOKEN: an event created
# with GITHUB_TOKEN triggers no further workflow run, so the caller's own required checks
# would never run on the pull request this opens.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing the .envrc to update. That directory and no other - nothing
          looks in a parent for one.
        type: string
        required: false
        default: '.'
      branch:
        description: Branch the pull request is opened from.
        type: string
        required: false
        default: 'deps/direnv'
      base:
        description: >-
          Branch the pull request targets. Empty means the branch that is checked out,
          which is create-pull-request's own default and right for a scheduled caller.
          A caller triggered by `pull_request` or `release` is in detached HEAD and MUST
          set this, or create-pull-request cannot rebase the change.
        type: string
        required: false
        default: ''
      dry-run:
        description: >-
          Perform the upgrade and report what moved, but open no pull request. Needs
          neither secret, so it is also how this workflow is tested. The result is in the
          job summary and in the outputs below.
        type: boolean
        required: false
        default: false
    secrets:
      app-client-id:
        description: >-
          The Client ID of a GitHub App installed on the calling repository, with
          Contents: read/write and Pull requests: read/write. This is the App's Client ID
          (App settings -> General -> Client ID), not the numeric App ID. Required unless
          dry-run is true.
        required: false
      app-private-key:
        description: >-
          A private key generated for that same App. Required unless dry-run is true.
        required: false
    outputs:
      changed:
        description: >-
          'true' when the .envrc was rewritten, 'false' otherwise.
        value: ${{ jobs.update.outputs.changed }}
      summary:
        description: >-
          Markdown table of what moved (dependency, from, to). Empty when nothing changed.
        value: ${{ jobs.update.outputs.summary }}
      pull-request-number:
        description: >-
          Number of the pull request that was created or updated. Empty when nothing
          changed, or on a dry run.
        value: ${{ jobs.update.outputs.pull-request-number }}
      pull-request-url:
        description: >-
          URL of that pull request. Empty under the same conditions as the number.
        value: ${{ jobs.update.outputs.pull-request-url }}

# Every write below goes through the App token, which this block does not govern.
# Declared narrowly so a caller that granted less fails loudly.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upgrade.outputs.changed }}
      summary: ${{ steps.upgrade.outputs.summary }}
      pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
      pull-request-url: ${{ steps.cpr.outputs.pull-request-url }}
    steps:
      # Fail here rather than three steps later, naming this workflow and the missing
      # secret. A `run:` test rather than an `if:` because a secret cannot be referenced
      # in an `if:` at all, hence the env indirection; unset arrives as the empty string.
      - name: Require the App credentials unless this is a dry run
        if: ${{ !inputs.dry-run }}
        env:
          CLIENT_ID: ${{ secrets.app-client-id }}
          PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          set -euo pipefail
          missing=''
          [[ -n "$CLIENT_ID" ]] || missing='app-client-id'
          [[ -n "$PRIVATE_KEY" ]] || missing="${missing:+$missing, }app-private-key"
          if [[ -n "$missing" ]]; then
            echo "update-direnv-dependencies: missing secret(s): $missing" >&2
            echo "This workflow opens its pull request as a GitHub App, so both" >&2
            echo "app-client-id and app-private-key must be passed in the calling" >&2
            echo "job's secrets: block. Set dry-run: true to upgrade and report" >&2
            echo "without opening a pull request, which needs neither secret." >&2
            exit 1
          fi

      - name: Mint a GitHub App installation token
        id: app-token
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      # A skipped step's output is the empty string, so a dry run falls through to
      # github.token and still checks out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Upgrade the pinned pixi version
        id: upgrade
        uses: TomBorglum/actions/direnv/upgrade-pixi@620f7172e46c5efa21265da290d3864f44e60850 # v3.4.0
        with:
          working-directory: ${{ inputs.working-directory }}

      # The one file the upgrade is allowed to have touched, so nothing else in the
      # checkout can reach the pull request. The prefix collapses for a '.' working
      # directory, so the pathspec reads `.envrc` rather than `./.envrc`.
      - name: Resolve the paths to commit
        id: paths
        if: ${{ steps.upgrade.outputs.changed == 'true' }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          dir="${WORKING_DIRECTORY%/}"
          prefix=''
          if [[ -n "$dir" && "$dir" != '.' ]]; then
            prefix="${dir#./}/"
          fi
          # The documented {name}<<{delimiter} form with a random delimiter, so a crafted
          # working-directory cannot close the heredoc early and forge another output.
          delimiter="ADD_PATHS_EOF_$(openssl rand -hex 16)"
          {
            printf 'add-paths<<%s\n' "$delimiter"
            printf '%s.envrc\n' "$prefix"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # The job summary is the entire payload of a dry run.
      - name: Report what moved
        env:
          CHANGED: ${{ steps.upgrade.outputs.changed }}
          SUMMARY: ${{ steps.upgrade.outputs.summary }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          {
            echo '## direnv dependency upgrade'
            echo
            if [[ "$CHANGED" == 'true' ]]; then
              echo "$SUMMARY"
              if [[ "$DRY_RUN" == 'true' ]]; then
                echo
                echo '_Dry run: no pull request was opened._'
              fi
            else
              echo 'Nothing to upgrade; no pull request needed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # No bot identity is resolved here because `sign-commits` below makes the action
      # ignore the committer and author inputs.
      - name: Create pull request
        id: cpr
        if: ${{ !inputs.dry-run && steps.upgrade.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          add-paths: ${{ steps.paths.outputs.add-paths }}
          branch: ${{ inputs.branch }}
          base: ${{ inputs.base }}
          delete-branch: true
          commit-message: "deps: update direnv-pinned tool versions"
          title: "deps: update direnv-pinned tool versions"
          body: |
            Automated upgrade of the tool versions pinned by direnv's `use` directives.
            Dependabot has no direnv ecosystem, so this is what bumps a version declared
            in an `.envrc`.

            ${{ steps.upgrade.outputs.summary }}

            Produced by
            [`TomBorglum/workflows/.github/workflows/update-direnv-dependencies.yml`](https://github.com/TomBorglum/workflows/blob/main/.github/workflows/update-direnv-dependencies.yml),
            which rewrote the `use pixi` directive and committed only `.envrc`.
