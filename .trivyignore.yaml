# Required by docker-hub-publish.yml, which passes `trivyignores: .trivyignore.yaml` to
# trivy-action unconditionally. Trivy treats a named ignorefile that does not exist as a
# FATAL error - `ignore file not found: .trivyignore.yaml` - and fails the scan before it
# looks at the image, so every repository calling that workflow needs this file at its
# root even when it suppresses nothing. The README says so under docker-hub-publish.
#
# This repository is a caller only through _test-docker-hub-publish.yml, which builds
# fixture-image. That image is FROM scratch and carries no packages, so there is nothing
# here to suppress and there never should be: a suppression in this file would mean the
# fixture had grown a real base image, which is the thing it exists to avoid.
#
# A real caller's entries belong here, each with `expired_at` so a suppression cannot
# outlive its reason by being forgotten.
vulnerabilities: []
