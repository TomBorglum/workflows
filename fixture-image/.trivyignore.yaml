# Suppressions for THIS image and no other, which is the point of the fixture.
#
# docker-hub-publish.yml resolves every element of `trivyignores` against the image's own
# directory, so this file is reachable only from the `fixture-image` entry in
# .github/docker-hub-publish.yml. fixture-image-plain declares no suppressions, and the
# test asserts that it receives none - one image with and one without is the only
# arrangement that proves each matrix leg gets its own paths rather than the union.
#
# The id below matches nothing and is meant to. fixture-image is FROM scratch, so it
# carries no packages and the scan reports no findings at all; this file exists to prove
# that a declared suppression file is validated, resolved and handed to trivy, not to
# suppress anything. A real id would make the fixture depend on a CVE staying published.
vulnerabilities:
  - id: CVE-0000-00000
    statement: >-
      Fixture entry. Matches no finding: fixture-image is FROM scratch and has no packages.
